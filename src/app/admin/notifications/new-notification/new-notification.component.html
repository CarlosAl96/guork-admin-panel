<form
  class="flex flex-column gap-3"
  [formGroup]="formGroup"
  (ngSubmit)="sendNotification()"
>
  <div class="flex gap-3 mt-3">
    <div class="w-full flex flex-column justify-content-center gap-2">
      <label for="title">Título</label>
      <input
        pInputText
        styleClass="w-full"
        formControlName="title"
        inputId="title"
      />
    </div>
  </div>

  <div class="flex gap-3">
    <div class="w-full flex flex-column justify-content-center gap-2">
      <label for="users">Enviar a</label>
      <p-multiSelect
        styleClass="w-full"
        inputId="users"
        formControlName="users"
        [options]="userOptions"
        [virtualScroll]="false"
        [filter]="true"
        [showToggleAll]="true"
        [loading]="loadingUsers"
        [optionLabel]="'label'"
        [optionValue]="'value'"
        (onFilter)="onUserFilter($event)"
        (onChange)="onUsersChange()"
        defaultLabel="Seleccione usuarios"
      >
        <ng-template let-option pTemplate="item">
          <span *ngIf="option.value === 'ALL'" style="font-weight: bold">{{
            option.label
          }}</span>
          <span *ngIf="option.value !== 'ALL'">{{ option.label }}</span>
        </ng-template>
      </p-multiSelect>
    </div>
  </div>

  <div class="flex gap-3">
    <div class="w-full flex flex-column justify-content-center gap-2">
      <label for="description">Descripción</label>
      <textarea
        rows="5"
        inputId="description"
        formControlName="description"
        cols="30"
        pInputTextarea
      >
      </textarea>
    </div>
  </div>

  <div class="w-full flex justify-content-end mt-3">
    <p-button
      class="btn-primary"
      type="submit"
      [disabled]="!formGroup.valid"
      [loading]="loading"
      label="Enviar notificación"
    />
  </div>
</form>
